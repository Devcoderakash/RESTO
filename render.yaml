services:
  # 1. Django REST Backend (Python Web Service)
  - type: web
    name: resto-backend
    env: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TRACKING_TOKEN_SECRET
        generateValue: true

  # 2. Customer Frontend (Static Site)
  - type: web
    name: resto-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

  # 3. Restaurant Dashboard (Static Site)
  - type: web
    name: resto-dashboard
    env: static
    rootDir: dashboard
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
