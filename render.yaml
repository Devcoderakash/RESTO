services:
  # 1. Django REST Backend (Python Web Service)
  - type: web
    name: resto-backend
    env: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn -k gthread --threads 4 --workers 2 --timeout 120 config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TRACKING_TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: "https://zmpthsiiouukjjyrbpnz.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # 2. Customer Frontend (Static Site)
  - type: web
    name: resto-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: VITE_API_URL
        value: "https://resto-vc53.onrender.com/api"
      - key: VITE_RESTAURANT_SLUG
        value: "olive-and-ember"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

  # 3. Restaurant Dashboard (Static Site)
  - type: web
    name: resto-dashboard
    env: static
    rootDir: dashboard
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: VITE_API_URL
        value: "https://resto-vc53.onrender.com/api"
      - key: VITE_RESTAURANT_SLUG
        value: "olive-and-ember"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

